<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarnessPet</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="pet-stage" aria-live="polite">
      <section id="bubble" class="bubble is-hidden" role="status">
        <div id="bubble-text" class="bubble-content" tabindex="0"></div>
        <div class="bubble-actions">
          <button id="bubble-reply" type="button">Reply</button>
          <button id="bubble-dismiss" type="button">Dismiss</button>
        </div>
      </section>

      <form id="composer" class="composer is-hidden">
        <label class="sr-only" for="prompt">Ask DeepSeek Harness</label>
        <textarea id="prompt" maxlength="4000" rows="3" placeholder="Ask Harness… (Enter to send)"></textarea>
        <div class="composer-meta">
          <label class="character-picker" for="character-select">
            <span>Character:</span>
            <select id="character-select" aria-label="Choose pet character"></select>
          </label>
          <span id="status-label">Ready</span>
        </div>
        <div class="composer-actions">
          <button id="new-conversation" type="button">New conversation</button>
          <button id="quit" type="button" aria-label="Quit HarnessPet">Quit</button>
          <button id="send" type="submit">Send</button>
        </div>
      </form>

      <div id="pet-wrap" class="pet-wrap" aria-label="HarnessPet desktop pet">
        <canvas id="pet-canvas" width="1" height="1"></canvas>
        <div id="thinking-dots" class="thinking-dots is-hidden" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
